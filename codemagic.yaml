workflows:
  jarvis-apk:
    name: Jarvis APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Unpack project
        script: |
          echo '' > p.b64
          base64 --decode < p.b64 > p.zip 2>/dev/null || base64 -D < p.b64 > p.zip
          ls -la p.zip
          unzip -q p.zip
      - name: Install Gradle 8.7
        script: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle.zip
          unzip -q gradle.zip
      - name: Build debug APK
        script: |
          cd jarvis-android
          ../gradle-8.7/bin/gradle assembleDebug --no-daemon
    artifacts:
      - jarvis-android/app/build/outputs/apk/debug/*.apk
